<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提早報到的小腳丫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14111c; --bg2:#1d1828; --card:#241e33; --line:#3a3150;
  --ink:#f3eef9; --mute:#a99fbd; --purple:#b48cff; --purple2:#8a5cf0;
  --pink:#ff9fc4; --blue:#7fb6ff; --warm:#ffd59a;
  --serif:"Noto Serif TC",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#2b2142 0%,var(--bg) 60%);color:var(--ink);font-family:var(--sans);line-height:1.8;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 16px 0}
header{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
header .t{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--mute);letter-spacing:.1em;white-space:nowrap}
.progress{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple2),var(--pink));transition:width .6s ease}
.count{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 0 24px}
.scene{animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-size:13px;letter-spacing:.25em;color:var(--purple);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,7vw,48px);line-height:1.35;margin-bottom:18px}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(23px,5vw,32px);line-height:1.45;margin-bottom:16px}
p{font-size:17px;margin-bottom:14px;color:#e2dbee}
p.small,.small{font-size:13px;color:var(--mute)}
em{font-style:normal;color:var(--purple);font-weight:700}
.big{font-family:var(--serif);font-weight:900;font-size:clamp(46px,12vw,80px);line-height:1.1;color:var(--purple);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}
.story{border-left:3px solid var(--pink);padding:4px 0 4px 16px;margin:18px 0;font-family:var(--serif)}
.story p{color:#f7eef7}
nav.ctrl{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;padding:14px 0 18px;background:linear-gradient(transparent,var(--bg) 35%)}
button{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:500;transition:transform .15s,background .2s,opacity .2s}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.btn-main{background:linear-gradient(135deg,var(--purple2),#b066e8);color:#fff;box-shadow:0 6px 20px -6px rgba(160,100,255,.7)}
.btn-main:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn-ghost:disabled{visibility:hidden}
.choices{display:grid;gap:10px;margin:16px 0}
.choice{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:14px;text-align:left;padding:14px 16px;font-size:16px}
.choice:hover{border-color:var(--purple)}
.choice.on{border-color:var(--purple);background:#2e2443;box-shadow:inset 0 0 0 1px var(--purple)}
.choice small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.reveal{margin-top:12px;animation:in .5s ease both}
/* dots */
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;max-width:360px;margin:20px auto}
.dot{aspect-ratio:1;border-radius:50%;background:#3b3352;transition:background .4s,transform .4s,box-shadow .4s}
.dot.on{background:var(--purple);transform:scale(1.12);box-shadow:0 0 12px rgba(180,140,255,.8)}
.dot.taitung{background:var(--pink);box-shadow:0 0 12px rgba(255,159,196,.8);transform:scale(1.12)}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--c)}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.seg button{padding:8px 16px;font-size:14px;background:var(--bg2);color:var(--mute);border:1px solid var(--line)}
.seg button.on{background:var(--purple2);color:#fff;border-color:var(--purple2)}
/* bars */
.bars{display:grid;gap:9px;margin:14px 0}
.bar{display:grid;grid-template-columns:62px 1fr 58px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:22px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;width:0;background:#5a4b7c;border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1),background .3s}
.bar.me .fill{background:linear-gradient(90deg,var(--purple2),var(--pink))}
.bar.me .lab,.bar.me .val{color:var(--ink);font-weight:700}
.bar .lab{color:var(--mute)} .bar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
/* chart */
svg text{font-family:var(--sans)}
.chart{width:100%;height:auto;display:block;margin:10px 0}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.8s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;animation:popin .5s ease forwards}
@keyframes popin{to{opacity:1}}
/* weight */
.wbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0}
.baby{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9e8,#f2a5c4 55%,#c97ca3);box-shadow:0 0 40px rgba(255,159,196,.35);transition:width .25s,height .25s}
.babywrap{height:190px;display:flex;align-items:center;justify-content:center}
input[type=range]{width:100%;accent-color:var(--purple)}
.wval{font-family:var(--serif);font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--serif);font-size:28px;color:var(--purple);font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:13px;color:var(--mute)}
/* ending */
.lamp{width:120px;height:120px;border-radius:50%;margin:20px auto;display:block;background:#2c2540;border:2px dashed var(--line);color:var(--mute);font-size:14px;transition:all .8s}
.lamp.lit{background:radial-gradient(circle,#e5d4ff 0%,var(--purple) 40%,var(--purple2) 75%);border-color:transparent;color:#1d1530;font-weight:700;box-shadow:0 0 60px 20px rgba(180,140,255,.45),0 0 140px 50px rgba(138,92,240,.25)}
body.purple{background:radial-gradient(ellipse at 50% 30%,#3d2766 0%,var(--bg) 70%)}
.sources{font-size:13px;color:var(--mute)}
.sources li{margin:6px 0 6px 18px}
.sources a{color:var(--blue);word-break:break-all}
.warn{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.warn div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:15px}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;margin:14px 0}
#twmap{width:100%;height:auto;display:block}
.cty{stroke:#14111c;stroke-width:.8;cursor:pointer;transition:fill .3s,stroke .3s}
.cty:hover{stroke:var(--purple);stroke-width:1.2}
.cty.sel{stroke:var(--pink);stroke-width:1.8}
.hdot{fill:#e5d4ff;filter:url(#glow);pointer-events:none;opacity:0;animation:popin .4s ease forwards}
.hdot.sel{fill:var(--pink)}
.maplab{fill:var(--mute);font-size:11px}
.mapside select{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.hlist{list-style:none;max-height:240px;overflow:auto;padding-right:4px}
.hlist li{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line);color:#e2dbee}
@media (max-width:600px){.mapwrap{grid-template-columns:1fr}#twmap{max-width:340px;margin:0 auto}}
@media (max-width:480px){p{font-size:16px}.bar{grid-template-columns:54px 1fr 52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.pop{opacity:1}}
</style>
</head>

</div>

function countUp(el, to, {dec=0, dur=1400, suffix=''}={}){
  const t0 = performance.now();
  const f = now => {
    const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = (to*e).toLocaleString('zh-TW',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + suffix;
    if(p<1) requestAnimationFrame(f);
  };

}

  <div class="story"><p>雅婷懷孕了。產檢本上的預產期，寫在明年二月。</p><p>她把超音波照片貼在冰箱上，每天早上都要看一眼。</p></div>
  <h2>雅婷今年幾歲？</h2>
  <p class="small">由你決定。這會影響她在統計上面對的早產機率。</p>
  <div class="choices" id="ages">
    ${AGE.slice(0,5).map(a=>`<button class="choice ${state.age===a.k?'on':''}" data-k="${a.k}">${a.label} 歲</button>`).join('')}
  </div>
  <div id="ageout"></div>
`}, mount(){
  const show=()=>{
    const me=AGE.find(a=>a.k===state.age);
    $('#ageout').innerHTML=`<div class="reveal card">
      <p>在 104 年（2015）的出生通報資料中，<b>${me.label} 歲</b>的產婦，生下早產兒的比率是 <em>${me.v}%</em>。</p>
      <div class="bars">${AGE.map(a=>`
        <div class="bar ${a.k===state.age?'me':''}"><span class="lab">${a.label}</span>
        <div class="track"><div class="fill" data-w="${a.v/47*100}"></div></div><span class="val">${a.v}%</span></div>`).join('')}
      </div>
      <p class="small">25–29 歲最低；未滿 20 歲與 35 歲以上都偏高，而且年齡越高越明顯。國健署公布的這份資料未列出 20–24 與 30–34 歲兩組數字，因此這裡不顯示。</p>
    </div>`;
    requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'));
    unlock();
  };
  document.querySelectorAll('#ages .choice').forEach(b=>b.onclick=()=>{
    state.age=b.dataset.k;
    document.querySelectorAll('#ages .choice').forEach(x=>x.classList.toggle('on',x===b));
    show();
  });
  if(state.age) show();
}},

/* 3 趨勢 */
{ render(){
  const W=640,H=300,L=46,R=20,T=24,B=40;
  const x=y=>L+(y-2006)/(2024-2006)*(W-L-R);
  const yv=v=>T+(12-v)/(12-8)*(H-T-B);
  const pts=[[2014,8.95],[2022,10.56],[2024,11.02]];
  return `
  <div class="kicker">第二章 · 不只是雅婷</div>
  <h2>這個比例，這些年一直在往上走</h2>
  <p>雅婷不知道的是，她懷孕的這個時代，早產比例比十幾年前更高。</p>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="台灣早產兒比率趨勢">
    ${[8,9,10,11,12].map(v=>`<line x1="${L}" x2="${W-R}" y1="${yv(v)}" y2="${yv(v)}" stroke="#3a3150"/><text x="${L-8}" y="${yv(v)+4}" fill="#a99fbd" font-size="12" text-anchor="end">${v}%</text>`).join('')}
    ${[2006,2010,2014,2018,2022,2024].map(y=>`<text x="${x(y)}" y="${H-14}" fill="#a99fbd" font-size="12" text-anchor="middle">${y}</text>`).join('')}
    <rect class="pop" x="${x(2006)}" y="${yv(9.4)}" width="${x(2015)-x(2006)}" height="${yv(8.5)-yv(9.4)}" fill="#8a5cf0" opacity=".25" rx="4"/>
    <text class="pop" x="${x(2010.5)}" y="${yv(9.4)-8}" fill="#c9b3ff" font-size="12" text-anchor="middle">2006–2015 維持在 8.5%–9.4%</text>
    <polyline class="draw" points="${pts.map(p=>x(p[0])+','+yv(p[1])).join(' ')}" fill="none" stroke="#b48cff" stroke-width="2.5" stroke-dasharray="6 5"/>
    ${pts.map((p,i)=>`<g class="pop" style="animation-delay:${.6+i*.5}s"><circle cx="${x(p[0])}" cy="${yv(p[1])}" r="6" fill="#ff9fc4"/><text x="${x(p[0])}" y="${yv(p[1])-14}" fill="#f3eef9" font-size="14" font-weight="700" text-anchor="middle">${p[1]}%</text></g>`).join('')}
  </svg>
  <p class="small">粉紅點為國健署公布的單年數值（2014、2022、2024）；虛線僅連接已公布數值，中間年份未標示。</p>
  <div class="card"><p>國健署指出，2022 年的早產比例比十年前<em>增加了約 1.5 個百分點</em>。台灣早產兒基金會認為，這和晚婚晚育、環境壓力、人工生殖等社會變化有關。</p>
  <p class="small">與此同時，台灣出生人數卻屢創新低，2014 年仍有約 1 萬 9 千名早產兒，近年則約 1 萬 3 千名——人數變少，比例卻變高。</p></div>
`}},

/* 5 體重 */
{ gate:true, render(){ return `
  <div class="kicker">第四章 · 一千一百八十公克</div>
  <h2>小豆有多小？</h2>
  <p>拖動滑桿，看看不同出生體重的寶寶。試著找到小豆的體重：<em>1,180 公克</em>。</p>
  <div class="wbox">
    <div class="babywrap"><div class="baby" id="baby"></div></div>
    <div class="wval" id="wv">3,000 g</div>
    <div id="wtag"></div>
  </div>
  <input type="range" id="w" min="500" max="3500" step="10" value="3000" aria-label="出生體重">
  <div class="small" style="display:flex;justify-content:space-between"><span>500 g</span><span>3,500 g</span></div>
  <div id="wout"></div>
`}, mount(){
  const r=$('#w'); let done=false;
  const upd=()=>{
    const g=+r.value, s=40+ (g-500)/3000*130;
    $('#baby').style.width=$('#baby').style.height=s+'px';
    $('#wv').textContent=g.toLocaleString()+' g';
    const [t,c]= g<1500?['極低出生體重 · 俗稱巴掌仙子','#ff9fc4']: g<2500?['低出生體重','#ffd59a']:['一般出生體重','#7fb6ff'];
    $('#wtag').innerHTML=`<span class="tag" style="background:${c}22;color:${c}">${t}</span>`;
    if(!done && Math.abs(g-1180)<=40){
      done=true;
      $('#wout').innerHTML=`<div class="reveal card"><p>找到了。1,180 公克，大約是一瓶 1.25 公升寶特瓶裝滿水的重量。</p>
      <div class="stats">
        <div class="stat"><b>10.16%</b><span>109 年新生兒中，出生體重低於 2,500 g 的比例（16,517 人）</span></div>
        <div class="stat"><b>1.02%</b><span>出生體重低於 1,500 g 的比例（1,664 人）</span></div>
      </div>
      <p class="small">國健署指出，這些體重低或極低的寶寶，心肺等器官尚未發育成熟，需要專業醫護團隊定期追蹤。</p></div>`;
      unlock();
    }
  };
  r.oninput=upd; upd();
}},

/* 6 NICU 選擇 */
{ gate:true, render(){ return `
  <div class="kicker">第五章 · 保溫箱旁</div>
  <div class="story"><p>新生兒加護病房很安靜，只有機器規律的聲音。小豆躺在保溫箱裡，身上貼著好幾條線。</p>
  <p>護理師說：「媽媽，你可以做點什麼。」</p></div>
  <h2>雅婷第一件想做的事是？</h2>
  <div class="choices" id="nicu">
    <button class="choice" data-k="touch">伸手，隔著保溫箱的小窗碰碰她<small>觸碰</small></button>
    <button class="choice" data-k="milk">開始擠母乳，一點一點存起來<small>哺育</small></button>
    <button class="choice" data-k="talk">靠近保溫箱，輕聲跟她說話<small>陪伴</small></button>
  </div>
  <div id="nout"></div>
`}, mount(){
  const T={
    touch:'雅婷的手指比小豆的手掌還大。小豆的手，慢慢握住了她的指尖。',
    milk:'第一天只擠出幾毫升。護理師把它標上名字，小心放進冰箱：「這是小豆的。」',
    talk:'雅婷說了一整個下午的話。監視器上的心跳數字，好像也慢慢穩了下來。'
  };
  const show=k=>{
    $('#nout').innerHTML=`<div class="reveal"><div class="story"><p>${T[k]}</p></div>
    <p class="small">沒有哪一個選擇是標準答案。每一個早產兒家庭，都在用自己的方式陪孩子撐過這段日子。實際照護方式請依醫療團隊建議。</p></div>`;
    unlock();
  };
  document.querySelectorAll('#nicu .choice').forEach(b=>{
    if(b.dataset.k===state.nicu) b.classList.add('on');
    b.onclick=()=>{state.nicu=b.dataset.k;document.querySelectorAll('#nicu .choice').forEach(x=>x.classList.toggle('on',x===b));show(b.dataset.k);};
  });
  if(state.nicu) show(state.nicu);
}},

    if(a==='tt'){
      $('#aout').innerHTML=`<div class="reveal card"><p>根據國健署 113 年出生通報統計年報，臺東地區早產兒出生比率達 <em>14.13%</em>，明顯高於全國平均 11.02%；出生體重低於 1,500 公克的極低體重早產兒比率 2.52%，也是全國最高。</p>

/* 8 回家 */
{ render(){ return `
  <div class="kicker">第七章 · 回家以後</div>
  <div class="story"><p>小豆在醫院住了兩個多月。出院那天，雅婷反而更緊張了：沒有監視器、沒有護理師，萬一她吐奶、哭不停怎麼辦？</p>
  <p>出院前，醫院的個管師給了她一支專線電話，說之後會有人到家裡看看小豆。</p></div>
  <p>這是國健署自 111 年起推動的<em>「低（含極低）出生體重兒居家照護計畫」</em>：出院前評估，返家後由醫療團隊提供居家訪視、視訊與電話關懷，一路陪到寶寶<em>矯正年齡 2 歲</em>。</p>
  <div class="stats">
    <div class="stat"><b data-n="81">0</b><span>家合作醫院</span></div>
    <div class="stat"><b data-n="4031">0</b><span>位極低出生體重兒收案（占出院人數 97.4%）</span></div>
    <div class="stat"><b data-n="1596">0</b><span>位特殊健康情形早產兒收案（97%）</span></div>
    <div class="stat"><b data-n="1800" data-s="+">0</b><span>次居家訪視</span></div>
    <div class="stat"><b data-n="4400">0</b><span>次視訊訪視</span></div>
    <div class="stat"><b data-n="30000" data-s="≈">0</b><span>次電話關懷（約數）</span></div>
  </div>
  <p class="small">統計截至 114 年 9 月底，累計數字。</p>

  <h2 style="margin-top:34px">離家最近的醫院在哪裡？</h2>
  <p>從台東轉診來的那位媽媽說，她們從家裡到醫院，要開好久的車。下面是衛福部評定的<em>重度級急救責任醫院</em>，具備最高等級的緊急醫療能力。點選縣市，看看那裡有幾家。</p>
  <div class="mapwrap">
    <svg id="twmap" viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="台灣重度級急救責任醫院分布圖">
      <defs><filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      ${COUNTIES.map(c=>`<path class="cty" data-n="${c.n}" d="${c.d}" style="fill:${ctyFill(c.n)}"><title>${c.n}</title></path>`).join('')}
      ${HOSP.map((h,i)=>`<circle class="hdot" data-n="${h[0]}" cx="${h[2]}" cy="${h[3]}" r="3.6" style="animation-delay:${i*25}ms"/>`).join('')}
      <text x="30" y="272" class="maplab">澎湖縣</text>
      <text x="10" y="20" class="maplab">● 重度級急救責任醫院</text>
    </svg>
    <div class="mapside">
      <select id="ctysel" aria-label="選擇縣市"></select>
      <div id="ctyinfo"></div>
    </div>
  </div>
  <p class="small">共 54 家（依衛福部「急救責任醫院分區名單」，115 年更新）。醫院位置為示意，非精確地址。金門縣、連江縣、澎湖縣目前沒有重度級醫院。急救責任醫院分級反映整體緊急醫療能力，不等同於各院新生兒加護病房的收治條件，待產或轉診請依產檢醫師建議。</p>
`}, mount(){
  const counts={};HOSP.forEach(h=>counts[h[0]]=(counts[h[0]]||0)+1);
  const names=[...COUNTIES.map(c=>c.n),'金門縣','連江縣'];
  const order=['基隆市','臺北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','臺中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'].filter(n=>names.includes(n));
  $('#ctysel').innerHTML=order.map(n=>`<option value="${n}">${n}（${counts[n]||0} 家）</option>`).join('');
  const pick=n=>{
    $('#ctysel').value=n;
    document.querySelectorAll('.cty').forEach(p=>p.classList.toggle('sel',p.dataset.n===n));
    document.querySelectorAll('.hdot').forEach(d=>d.classList.toggle('sel',d.dataset.n===n));
    const list=HOSP.filter(h=>h[0]===n);
    $('#ctyinfo').innerHTML=`<div class="reveal"><p style="font-family:var(--serif);font-size:22px;font-weight:700;margin:10px 0 2px">${n}</p>
      <p style="margin-bottom:8px"><span class="big" style="font-size:40px">${list.length}</span> 家重度級急救責任醫院</p>

      ${n==='臺東縣'?`<p class="small" style="color:var(--pink)">臺東是全國早產比率最高的縣市（14.13%），全縣只有 1 家重度級醫院。</p>`:''}</div>`;
  };
  document.querySelectorAll('.cty').forEach(p=>p.onclick=()=>pick(p.dataset.n));
  $('#ctysel').onchange=e=>pick(e.target.value);
  pick('臺東縣');
  document.querySelectorAll('.stat b[data-n]').forEach((b,i)=>setTimeout(()=>{
    const s=b.dataset.s||'';
    if(s==='≈'){ countUp(b,+b.dataset.n); setTimeout(()=>b.textContent='近 3 萬',1500); }
    else countUp(b,+b.dataset.n,{suffix:s});
  },i*120));
}},

/* 8.5 成長追蹤 */
{ gate:true, render(){ return `
  <div class="kicker">第八章 · 回診的日子</div>
  <div class="story"><p>出院後，雅婷的手機行事曆塞滿了回診。新生兒科、兒科、神經科、復健科⋯⋯她一開始搞不清楚，為什麼要看這麼多科。</p>
  <p>醫師告訴她：「早產兒的成長要追蹤，不是因為一定有問題，而是越早發現，越來得及幫忙。」</p></div>
  <h2>點開每一科，看看他們在追蹤什麼</h2>

`}, mount(){
  const D={
    neo:['新生兒科','從加護病房一路照顧到出院的科別。出院後，許多醫院會由新生兒科安排「早產兒追蹤門診」，定期記錄體重、身長、頭圍的生長曲線，留意餵食與呼吸狀況，並協助安排眼睛（視網膜）、聽力等檢查。','雅婷：「新生兒科醫師最懂小豆住院時的狀況，有問題第一個就問他。」'],

function outro(){return `<div class="reveal" style="text-align:center"><p>謝謝你，為每一雙提早報到的小腳丫點了一盞燈。</p><p class="small">他們輸在起跑點，但可以一起抵達終點。</p></div>`;}

/* ---------- engine ---------- */
let i=0;
function unlock(){ nextBtn.disabled=false; }
function go(n){
  i=Math.max(0,Math.min(scenes.length-1,n));
  const s=scenes[i];
  if(i!==scenes.length-1) document.body.classList.remove('purple');
  stage.innerHTML=`<section class="scene">${s.render()}</section>`;
  s.mount && s.mount();
  if(s.gate && !nextBtn._keep){ /* 等待互動才能前進 */ }
  nextBtn.disabled = !!s.gate && !alreadyDone(i);
  if(s.gate && alreadyDone(i)) unlock();
  nextBtn.textContent = s.cta || (i===scenes.length-2?'最後一章 →':'下一頁 →');
  if(s.gate && nextBtn.disabled) nextBtn.title='完成本頁互動後即可繼續';
  prevBtn.disabled = i===0;
  $('#bar').style.width = (i/(scenes.length-1)*100)+'%';
  $('#count').textContent = `${i+1} / ${scenes.length}`;
  window.scrollTo({top:0,behavior:'smooth'});
}
const visited=new Set();
function alreadyDone(n){ return visited.has(n); }
nextBtn.onclick=()=>{
  if(nextBtn.disabled) return;
  visited.add(i);
  if(i===scenes.length-1){ state.age=null;state.nicu=null;state.lit=false;visited.clear();go(0);return; }
  go(i+1);
};
prevBtn.onclick=()=>{ visited.add(i); go(i-1); };
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') nextBtn.click();
  if(e.key==='ArrowLeft') prevBtn.click();
});
go(0);

/* ---------- starfield ---------- */
(()=>{
  const c=$('#stars'),x=c.getContext('2d');let st=[];
  const rs=()=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
    st=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4*devicePixelRatio+.3,p:Math.random()*6}));};
  rs();addEventListener('resize',rs);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f=t=>{x.clearRect(0,0,c.width,c.height);
    st.forEach(s=>{x.globalAlpha=.25+.35*Math.sin(t/1400+s.p)**2;x.fillStyle='#d9c8ff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();});
    if(!reduce)requestAnimationFrame(f);};
  requestAnimationFrame(f);
})();
</script>
